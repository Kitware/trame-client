[project]
name = "trame-client"
version = "3.13.6"
description = "Internal client of trame"
authors = [
    {name = "Kitware Inc."},
]
dependencies = [
    "trame-common>=0.2.0",
]
requires-python = ">=3.10"
readme = "README.rst"
license = {text = "MIT"}
keywords = ["Python", "Interactive", "Web", "Application", "Framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
    "numpy",
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "pytest-xprocess",
    "Pillow",
    "pixelmatch",
    "trame>=3.13",
]
dev = [
    "pre-commit",
    "ruff",
]






[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "/src/**/*.py",
  "/src/trame_client/module/vue2-www/**",
  "/src/trame_client/module/vue3-www/**",
  "src/trame_client/module/user_provided_scripts/**",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trame_client",
    "src/trame",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/trame_client/__init__.py:__version__",
]
build_command = """
  python -m venv .venv
  source .venv/bin/activate
  pip install -U pip build
  python -m build .
"""

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/trame_client/widgets/html.py" = ["E742"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.lint.pydocstyle]
convention = "google"
