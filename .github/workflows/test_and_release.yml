name: Test and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx nox -s pre_commit

  pytest:
    name: Pytest ${{ matrix.config.name }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        config:
          - { name: "Linux", os: ubuntu-latest }
        # - {
        #     name: "MacOSX",
        #     os: macos-latest
        #   }
        # - {
        #     name: "Windows",
        #     os: windows-latest
        #   }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Tests (via nox)
        run: |
          # noxfile.py builds the Vue2/Vue3 client bundles, installs the
          # package with test extras, installs Playwright, and runs pytest
          # under coverage for this specific Python version.
          uvx nox -s "tests-${{ matrix.python-version }}"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7

  test-npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build js-lib
        run: |
          cd js-lib
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build Vue2 App
        run: |
          cd vue2-app
          npm ci
          npm run build

      - name: Build Vue3 App
        run: |
          cd vue3-app
          npm ci
          npm run build

      - name: Build React App
        run: |
          cd react-app
          npm ci
          npm test
          npm run build

  release:
    needs: [pre-commit, pytest, test-npm-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/trame-client
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write # IMPORTANT: mandatory for making GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build js-lib
        run: |
          cd js-lib
          npm ci
          npm run build

      - name: Build Vue2 App
        run: |
          cd vue2-app
          npm ci
          npm run build

      - name: Build Vue3 App
        run: |
          cd vue3-app
          npm ci
          npm run build

      - name: Build React App
        run: |
          cd react-app
          npm ci
          npm run build

      - name: Python Semantic Release
        id: release
        uses: relekang/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
